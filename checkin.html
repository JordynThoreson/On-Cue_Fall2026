<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tell OnCue a little about you and your current context to help it make recommendations.">
    <link rel="stylesheet" href="styles.css">
    <title>OnCue - Check In</title>
</head>

<body>

    <h1>OnCue</h1>

    <h2>Tell us about you</h2>

    <main class="checkin-layout">

        <div class="checkin-question">
            <label for="genre">Preferred genre</label>
            <select id="genre">
                <option value="" selected disabled>Answer choices</option>
                <option value="any">I don't know — surprise me</option>
                <option value="Comedy">Something funny</option>
                <option value="Drama">Something serious</option>
                <option value="Horror">Something scary</option>
                <option value="Romance">Something romantic</option>
                <option value="Thriller">Something suspenseful</option>
                <option value="Action">Something exciting</option>
            </select>
        </div>

        <div class="checkin-question">
            <label for="mood">Current mood</label>
            <select id="mood">
                <option value="" selected disabled>Answer choices</option>
                <option value="relaxed">Relaxed</option>
                <option value="happy">Happy</option>
                <option value="stressed">Stressed</option>
                <option value="bored">Bored</option>
                <option value="excited">Excited</option>
            </select>
        </div>

        <div class="checkin-question">
            <label for="watching">Watching with...</label>
            <select id="watching">
                <option value="" selected disabled>Answer choices</option>
                <option value="alone">Just me</option>
                <option value="partner">My partner</option>
                <option value="friends">Friends</option>
                <option value="family">Family</option>
            </select>
        </div>

        <div class="checkin-question">
            <label for="attention">Attention level</label>
            <select id="attention">
                <option value="" selected disabled>Answer choices</option>
                <option value="focused">I want to actually watch</option>
                <option value="casual">Something I can have on in the background</option>
            </select>
        </div>

        <div class="checkin-question">
            <label for="runtime">Watch time</label>
            <select id="runtime">
                <option value="" selected disabled>Answer choices</option>
                <option value="30">About 30 minutes</option>
                <option value="60">About 1 hour</option>
                <option value="90">About 1.5 hours</option>
            </select>
        </div>

        <button id="findButton" type="button">Get Picks</button>

        <p id="message"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
