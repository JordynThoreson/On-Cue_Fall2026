<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OnCue - Check In</title>
</head>

<body>

    <h1>OnCue</h1>

    <h2>Tell us about you</h2>


    <label for="genre">
        What do you want to watch?
    </label>

    <select id="genre">

        <option value="any">
            I don't know — surprise me
        </option>

        <option value="Comedy">
            Something funny
        </option>

        <option value="Drama">
            Something serious
        </option>

        <option value="Horror">
            Something scary
        </option>

        <option value="Romance">
            Something romantic
        </option>

        <option value="Thriller">
            Something suspenseful
        </option>

        <option value="Action">
            Something exciting
        </option>

    </select>


    <br><br>


    <label for="mood">
        How are you feeling?
    </label>

    <select id="mood">

        <option value="relaxed">
            Relaxed
        </option>

        <option value="happy">
            Happy
        </option>

        <option value="stressed">
            Stressed
        </option>

        <option value="bored">
            Bored
        </option>

        <option value="excited">
            Excited
        </option>

    </select>


    <br><br>


    <label for="watching">
        Who are you watching with?
    </label>

    <select id="watching">

        <option value="alone">
            Just me
        </option>

        <option value="partner">
            My partner
        </option>

        <option value="friends">
            Friends
        </option>

        <option value="family">
            Family
        </option>

    </select>


    <br><br>


    <label for="attention">
        How much attention do you want to give it?
    </label>

    <select id="attention">

        <option value="focused">
            I want to actually watch
        </option>

        <option value="casual">
            Something I can have on in the background
        </option>

    </select>


    <br><br>


    <label for="runtime">
        How much time do you have?
    </label>

    <select id="runtime">

        <option value="30">
            About 30 minutes
        </option>

        <option value="60">
            About 1 hour
        </option>

        <option value="90">
            About 1.5 hours
        </option>

    </select>


    <br><br>


    <button id="findButton">
        Get Picks
    </button>


    <p id="message"></p>


    <script src="script.js"></script>

</body>

</html>
