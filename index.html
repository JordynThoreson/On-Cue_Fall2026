<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>On Cue - Proof of Concept</title>
</head>

<body>

    <h1>On Cue</h1>

    <p>
        Find something to watch without endless scrolling.
    </p>


    <label for="genre">What are you in the mood for?</label>

    <select id="genre">

        <option value="Comedy">
            Something funny
        </option>

        <option value="Drama">
            Something serious
        </option>

        <option value="Horror">
            Something scary
        </option>

        <option value="Romance">
            Something romantic
        </option>

        <option value="Thriller">
            Something suspenseful
        </option>

        <option value="Action">
            Something exciting
        </option>

    </select>


    <br><br>


    <label for="runtime">
        How much time do you have?
    </label>

    <select id="runtime">

        <option value="30">
            About 30 minutes
        </option>

        <option value="60">
            About 1 hour
        </option>

        <option value="90">
            About 1.5 hours
        </option>

    </select>


    <br><br>


    <button id="findButton">
        Find My Picks
    </button>


    <h2>Your Picks</h2>


    <div id="results">

        <p>
            Your recommendations will appear here.
        </p>

    </div>


    <p>
        <a href="https://www.tvmaze.com/" target="_blank">
            TV data provided by TVmaze.
        </a>
    </p>


    <script src="script.js"></script>

</body>

</html>
