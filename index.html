<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet OnCue, a personalized TV recommendation app that helps you find something to watch based on your mood, preferences and current viewing context.">
    <link rel="stylesheet" href="styles.css">
    <title>OnCue - Welcome</title>
</head>

<body class="welcome-page">

    <header>
        <h1>OnCue</h1>
    </header>

    <main>
        <h2>Welcome</h2>

        <img
            src="Images/erik-mclean-U-Vu_r6qyyU-unsplash.jpg"
            alt="A hand holds a remote out towards a T V screen"
            class="welcome-hero"
        >

        <p>Looking for something to watch?</p>

        <button id="startButton" type="button">
            Get Started
        </button>
    </main>

    <script>
        const startButton = document.querySelector("#startButton");

        startButton.addEventListener("click", function() {
            window.location.href = "checkin.html";
        });
    </script>

</body>
</html>
